<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arete.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Areté" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Areté — Excellence, Engineered.</title>
    <meta name="description" content="Academic companion for University of Uyo students — every course from 100L to 400L, interactive Java, Python & C tracks, and an AI tutor that knows the curriculum." />
    <meta name="theme-color" content="#FAF6EC" />
    <!-- Only `max-image-preview:large` actually changes Google's behaviour: the
         default there is `standard`, while an absent `max-snippet` already means
         "Google chooses the length" — which is precisely what -1 asks for — and
         "index, follow" is documented as the default with no effect if listed.
         The two -1s stay anyway because they are an explicit grant to the
         engines that are not Google and do read them, and they cost nothing.
         Do not add "index, follow" back; a directive that does nothing invites
         the reader to assume the rest of the line is equally decorative. -->
    <meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- llms.txt v2 defines this relation: `describedby` points at the llms.txt
         that COVERS this page. `rel="alternate" type="text/markdown"` is a
         different claim — it means "here is this page rendered as markdown" —
         and pointing that at a site-wide manifest tells an agent the manifest
         is the markdown of whatever page it is reading. -->
    <link rel="describedby" href="/llms.txt" />
    <!-- Apply the saved/system theme before first paint to avoid a flash.
         External (not inline) so it satisfies the strict CSP without a hash. -->
    <script src="/theme-init.js"></script>
    <link rel="canonical" href="https://www.aretecyb.tech/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Areté" />
    <meta property="og:url" content="https://www.aretecyb.tech/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Areté — Excellence, Engineered." />
    <meta property="og:description" content="Courses, interactive programming tracks, and an AI tutor for University of Uyo students. By JRsolvy." />
    <meta property="og:image" content="https://www.aretecyb.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Areté — academic companion for University of Uyo students. Courses, Java/Python/C tracks, AI Tutor." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Areté — Excellence, Engineered." />
    <meta name="twitter:description" content="Courses, interactive programming tracks, and an AI tutor for University of Uyo students." />
    <meta name="twitter:image" content="https://www.aretecyb.tech/og-image.png" />

    <!-- Site-level structured data. scripts/prerender.mjs appends a per-course
         Course + BreadcrumbList block to each prerendered file; this pair is
         what every page carries.

         An application/ld+json block is a data block, not executable script:
         the HTML spec's "prepare the script element" algorithm returns before
         the CSP check for any type that is neither classic nor module, so this
         needs no 'unsafe-inline' and no hash in vercel.json's script-src. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "@id": "https://www.aretecyb.tech/#organization",
      "name": "Areté",
      "alternateName": ["Arete", "Arete UniUyo", "Areté UniUyo"],
      "url": "https://www.aretecyb.tech/",
      "logo": "https://www.aretecyb.tech/icon-512.png",
      "image": "https://www.aretecyb.tech/og-image.png",
      "description": "Academic companion for University of Uyo students in every department — course outlines, transcribed lecture notes, past-paper practice, interactive Java, Python and C tracks, and an AI tutor that knows the curriculum. The GST, MTH, PHY, STA, COS, CSC, ENT and INS foundation courses taken across the university's programmes are covered for every student; Cybersecurity and Data Science have full departmental catalogues.",
      "knowsLanguage": "en",
      "knowsAbout": [
        "University of Uyo curriculum",
        "Communication in English (GST)",
        "Elementary Mathematics (MTH)",
        "General Physics (PHY)",
        "Descriptive Statistics (STA)",
        "Computing Sciences (COS, CSC)",
        "Entrepreneurship (ENT)",
        "Cybersecurity",
        "Data Science",
        "Java programming",
        "Python programming",
        "C programming",
        "Capture the flag"
      ],
      "areaServed": { "@type": "AdministrativeArea", "name": "Akwa Ibom State, Nigeria" },
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "University of Uyo undergraduates, all departments"
      },
      "founder": { "@id": "https://www.aretecyb.tech/#author" },
      "publisher": { "@id": "https://www.aretecyb.tech/#author" }
    }
    </script>
    <!-- The institution as its own node rather than a nested blob, so the
         sameAs links resolve Areté's subject to a real entity an engine already
         knows. Q7896523 is the University of Uyo — verified against Wikidata,
         not inferred from a name match. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollegeOrUniversity",
      "@id": "https://www.uniuyo.edu.ng/#organization",
      "name": "University of Uyo",
      "alternateName": ["UniUyo", "Uniuyo"],
      "url": "https://www.uniuyo.edu.ng/",
      "sameAs": [
        "https://en.wikipedia.org/wiki/University_of_Uyo",
        "https://www.wikidata.org/wiki/Q7896523"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Uyo",
        "addressRegion": "Akwa Ibom State",
        "addressCountry": "NG"
      },
      "subOrganization": { "@id": "https://www.aretecyb.tech/#organization" }
    }
    </script>
    <!-- E-E-A-T: who made this and on what authority. "JRsolvy" appeared only
         in a meta tag, which is a string; this is an entity engines can attach
         experience to. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://www.aretecyb.tech/#author",
      "name": "JRsolvy",
      "url": "https://www.aretecyb.tech/about",
      "jobTitle": "Founder and author, Areté",
      "description": "Builds and writes Areté — the course outlines, transcribed lecture notes and practice banks are authored from the University of Uyo curriculum and lecturers' own workbooks.",
      "affiliation": { "@id": "https://www.uniuyo.edu.ng/#organization" },
      "knowsAbout": ["Cybersecurity", "Data Science", "Java", "Python", "C", "University of Uyo curriculum"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.aretecyb.tech/#website",
      "name": "Areté",
      "alternateName": "Areté — University of Uyo academic companion",
      "url": "https://www.aretecyb.tech/",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "about": { "@id": "https://www.uniuyo.edu.ng/#organization" },
      "publisher": { "@id": "https://www.aretecyb.tech/#organization" },
      "author": { "@id": "https://www.aretecyb.tech/#author" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
