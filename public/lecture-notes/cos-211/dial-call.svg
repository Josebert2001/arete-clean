<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1110" width="540" height="1110" role="img" aria-label="Flowchart: dial a number and receive a call">
<title>Flowchart: dial a number and receive a call</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="540" height="1110" fill="#ffffff"/>
<ellipse cx="290" cy="40" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><polygon points="200,95 400,95 380,145 180,145" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Type a number</text><polygon points="290,180 390,225 290,270 190,225" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="216.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is number</text><text x="290" y="233.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">correct?</text><rect x="185" y="305" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="330.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">dial number</text><polygon points="290,390 390,435 290,480 190,435" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="426.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is call</text><text x="290" y="443.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">connected?</text><rect x="185" y="525" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="550.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Wait and listen</text><polygon points="290,610 390,655 290,700 190,655" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="646.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is call</text><text x="290" y="663.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">answered?</text><rect x="185" y="735" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="760.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start talking</text><polygon points="290,830 390,875 290,920 190,875" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="866.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is call</text><text x="290" y="883.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">complete?</text><rect x="30" y="850" width="130" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="95" y="875.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Keep talking</text><rect x="185" y="960" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="985.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">End call</text><ellipse cx="290" cy="1065" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="290" y="1065.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><path d="M290,64 L290,95" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M290,145 L290,180" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M290,270 L290,305" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="298" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">Y</text><path d="M190,225 L70,225 L70,120 L190,120" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="168" y="211.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">N</text><path d="M290,355 L290,390" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M190,435 L70,435 L70,330 L185,330" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="168" y="421.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">N</text><path d="M290,480 L290,525" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="298" y="492.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">Y</text><path d="M290,575 L290,610" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M190,655 L70,655 L70,500 L290,500" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="168" y="641.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">N</text><path d="M290,700 L290,735" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="298" y="712.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">Y</text><path d="M290,785 L290,830" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M190,875 L160,875" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="168" y="861.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">N</text><path d="M95,850 L95,812 L290,812" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M290,920 L290,960" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="298" y="932.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">Y</text><path d="M290,1010 L290,1041" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
