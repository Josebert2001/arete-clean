<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" width="720" height="630" role="img" aria-label="Flowchart: decide whether a number is positive, negative or zero">
<title>Flowchart: decide whether a number is positive, negative or zero</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="720" height="630" fill="#ffffff"/>
<ellipse cx="300" cy="40" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="300" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">START</text><polygon points="210,95 410,95 390,145 190,145" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="300" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">READ NUMBER</text><polygon points="300,180 395,225 300,270 205,225" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="300" y="225.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">IF N ≤ 0</text><polygon points="495,197 685,197 665,253 475,253" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="580" y="215.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">PRINT N IS</text><text x="580" y="234.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">POSITIVE</text><polygon points="150,325 245,370 150,415 55,370" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="150" y="370.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">IF N &lt; 0</text><polygon points="305,342 475,342 455,398 285,398" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="380" y="360.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">PRINT N IS</text><text x="380" y="379.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">ZERO</text><polygon points="65,462 255,462 235,518 45,518" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="150" y="480.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">PRINT N IS</text><text x="150" y="499.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">NEGATIVE</text><ellipse cx="580" cy="590" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="580" y="590.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">END</text><path d="M300,64 L300,95" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M300,145 L300,180" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M395,225 L485,225" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="403" y="211.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">NO</text><path d="M205,225 L150,225 L150,325" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="161" y="211.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">YES</text><path d="M245,370 L295,370" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="253" y="356.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">NO</text><path d="M150,415 L150,462" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="158" y="427.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">YES</text><path d="M580,253 L580,566" fill=