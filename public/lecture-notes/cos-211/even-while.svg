<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 580" width="580" height="580" role="img" aria-label="Flowchart 1: print the even numbers up to n with a while loop">
<title>Flowchart 1: print the even numbers up to n with a while loop</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="580" height="580" fill="#ffffff"/>
<ellipse cx="220" cy="40" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><polygon points="130,95 330,95 310,145 110,145" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="120.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">input n</text><rect x="145" y="175" width="150" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="200.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">i = 2</text><polygon points="220,260 315,305 220,350 125,305" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="305.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is i ≤ n?</text><ellipse cx="470" cy="305" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="470" y="305.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><polygon points="130,385 330,385 310,435 110,435" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="410.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">print i</text><rect x="145" y="465" width="150" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="220" y="490.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">i = i + 2</text><path d="M220,64 L220,95" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,145 L220,175" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,225 L220,260" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M315,305 L400,305" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="291.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">No</text><path d="M220,350 L220,385" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="228" y="362.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">Yes</text><path d="M220,435 L220,465" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,515 L220,545 L50,545 L50,245 L220,245" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
