<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 570" width="660" height="570" role="img" aria-label="Flowchart for Algorithm 3: stop reading scores when the sentinel −1 arrives">
<title>Flowchart for Algorithm 3: stop reading scores when the sentinel −1 arrives</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="660" height="570" fill="#ffffff"/>
<ellipse cx="240" cy="45" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="240" y="45.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><rect x="135" y="100" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="240" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = 0</text><polygon points="150,190 350,190 330,240 130,240" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="240" y="215.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get score</text><polygon points="240,275 340,320 240,365 140,320" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="240" y="320.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is score = −1?</text><rect x="135" y="405" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="240" y="430.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + score</text><polygon points="445,405 615,405 595,455 425,455" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="520" y="430.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">output sum</text><ellipse cx="520" cy="520" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="520" y="520.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><path d="M240,69 L240,100" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,150 L240,190" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,240 L240,275" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,365 L240,405" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="248" y="377.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">no</text><path d="M340,320 L520,320 L520,405" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="306.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">yes</text><path d="M520,455 L520,496" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,455 L240,485 L60,485 L60,168 L240,168" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
