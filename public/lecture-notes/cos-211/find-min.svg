<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800" role="img" aria-label="Flowchart: find the location LOC and value MIN of the smallest element in DATA">
<title>Flowchart: find the location LOC and value MIN of the smallest element in DATA</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="700" height="800" fill="#ffffff"/>
<ellipse cx="250" cy="40" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><rect x="135" y="95" width="230" height="80" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><line x1="151" y1="95" x2="151" y2="175" stroke="#2b211c" stroke-width="2"/><line x1="349" y1="95" x2="349" y2="175" stroke="#2b211c" stroke-width="2"/><text x="250" y="116.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">MIN = DATA[1]</text><text x="250" y="135.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">LOC = 1</text><text x="250" y="153.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">K = 2</text><polygon points="160,215 360,215 340,265 140,265" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="240.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Input N</text><polygon points="250,300 345,345 250,390 155,345" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="345.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is K &gt; N?</text><polygon points="480,313 660,313 640,377 460,377" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="560" y="335.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">print LOC</text><text x="560" y="354.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">print MIN</text><ellipse cx="560" cy="450" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="560" y="450.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><polygon points="250,430 360,480 250,530 140,480" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="471.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">is</text><text x="250" y="488.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central">MIN &gt; DATA[K]?</text><rect x="145" y="570" width="210" height="60" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="590.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">LOC = K</text><text x="250" y="609.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">MIN = DATA[K]</text><rect x="165" y="680" width="170" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="250" y="705.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">K = K + 1</text><path d="M250,64 L250,95" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,175 L250,215" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,265 L250,300" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M345,345 L470,345" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="353" y="331.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">yes</text><path d="M560,377 L560,426" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,390 L250,430" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="402.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">no</text><path d="M250,530 L250,570" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="542.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">yes</text><path d="M140,480 L95,480 L95,655 L250,655" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="112" y="466.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a5a2b" text-anchor="start" dominant-baseline="central" font-weight="600">no</text><path d="M250,630 L250,680" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M250,730 L250,760 L40,760 L40,292 L250,292" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/>
