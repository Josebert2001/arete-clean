<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" role="img" aria-label="Flowchart for Algorithm 1: get and add each of five scores in turn">
<title>Flowchart for Algorithm 1: get and add each of five scores in turn</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="680" height="650" fill="#ffffff"/>
<ellipse cx="180" cy="45" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="45.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><rect x="65" y="100" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = 0</text><polygon points="85,180 295,180 275,230 65,230" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="205.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get first score</text><rect x="65" y="260" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="285.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + first score</text><polygon points="85,340 295,340 275,390 65,390" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="365.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get second score</text><rect x="65" y="420" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="445.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + second score</text><polygon points="85,500 295,500 275,550 65,550" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="525.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get third score</text><circle cx="180" cy="605" r="20" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="180" y="605.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">A</text><circle cx="490" cy="45" r="20" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="45.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">A</text><rect x="375" y="100" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + third score</text><polygon points="395,180 605,180 585,230 375,230" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="205.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get fourth score</text><rect x="375" y="260" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="285.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + fourth score</text><polygon points="395,340 605,340 585,390 375,390" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="365.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get fifth score</text><rect x="375" y="420" width="230" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="445.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + fifth score</text><polygon points="395,500 605,500 585,550 375,550" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="525.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">output sum</text><ellipse cx="490" cy="605" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="490" y="605.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><path d="M180,69 L180,100" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,150 L180,180" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,230 L180,260" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,310 L180,340" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,390 L180,420" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,470 L180,500" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,550 L180,585" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,65 L490,100" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,150 L490,180" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,230 L490,260" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,310 L490,340" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,390 L490,420" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,470 L490,500" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,550 L490,581" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/>
