<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="460" height="520" role="img" aria-label="Flowchart for Algorithm 2: the loop returns to get score forever">
<title>Flowchart for Algorithm 2: the loop returns to get score forever</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="460" height="520" fill="#ffffff"/>
<ellipse cx="230" cy="45" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="45.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Start</text><rect x="125" y="100" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="125.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = 0</text><polygon points="140,190 340,190 320,240 120,240" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="215.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">get score</text><rect x="125" y="280" width="210" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="305.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">sum = sum + score</text><polygon points="140,370 340,370 320,420 120,420" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="395.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">output sum</text><ellipse cx="230" cy="475" rx="70" ry="24" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="230" y="475.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central">Stop</text><path d="M230,69 L230,100" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M230,150 L230,190" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M230,240 L230,280" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M230,330 L230,370" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d