<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="The seven basic flowchart symbols">
<title>The seven basic flowchart symbols</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211c"/></marker></defs>
<rect width="800" height="360" fill="#ffffff"/>
<ellipse cx="115" cy="80" rx="60" ry="25" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="115" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><text x="115" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Terminal</text><rect x="235" y="55" width="140" height="50" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="305" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><text x="305" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Process</text><polygon points="440,55 570,55 550,105 420,105" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="495" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><text x="495" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Input / Output</text><polygon points="685,40 740,80 685,120 630,80" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="685" y="80.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><text x="685" y="155.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Decision</text><rect x="40" y="212" width="150" height="56" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><line x1="56" y1="212" x2="56" y2="268" stroke="#2b211c" stroke-width="2"/><line x1="174" y1="212" x2="174" y2="268" stroke="#2b211c" stroke-width="2"/><text x="115" y="240.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><text x="115" y="315.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Predefined process</text><path d="M305,240 L305,200" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M305,240 L305,280" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M305,240 L255,240" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><path d="M305,240 L355,240" fill="none" stroke="#2b211c" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="315.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Flow lines</text><circle cx="455" cy="240" r="20" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="455" y="240.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central"></text><polygon points="513,218 557,218 557,246 535,264 513,246" stroke="#2b211c" stroke-width="2" fill="#fffaf2"/><text x="455" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a5a2b" text-anchor="middle" dominant-baseline="central">on-page</text><text x="535" y="282.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a5a2b" text-anchor="middle" dominant-baseline="central">off-page</text><text x="495" y="315.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2b211c" text-anchor="middle" dominant-baseline="central" font-weight="600">Connectors</text>
</svg>
